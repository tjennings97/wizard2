# PR merge gate. See "CI — GitHub Actions" in docs/operations/deployment-infrastructure.md.
name: ci-pr

on:
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wizard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # The pytest suite and the server under test share wizard_test. The Jest integration
      # tests derive their own database (wizard_jest) from this URL and create it themselves.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/wizard_test
      SESSION_SECRET: ci-session-secret
      PROMETHEUS_TOKEN: ci-prometheus-token
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/api/requirements.txt

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test -w server

      - name: Integration tests
        run: npm run test:integration -w server

      - name: Migrate test database
        run: npm run migrate:latest -w server

      - name: Start server
        working-directory: server
        env:
          TRUST_PROXY_HOPS: 1
          PORT: 3100
        run: |
          nohup npx tsx src/index.ts > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3100/health > /dev/null; then
              echo "Server is up"
              exit 0
            fi
            sleep 1
          done
          echo "Server did not become healthy within 60s"
          cat "$RUNNER_TEMP/server.log"
          exit 1

      - name: Install API test dependencies
        run: pip install -r tests/api/requirements.txt

      - name: API tests
        env:
          API_BASE_URL: http://127.0.0.1:3100/api/v1
        run: pytest tests/api

      - name: Server log
        if: always()
        run: cat "$RUNNER_TEMP/server.log" 2>/dev/null || echo "No server log"
